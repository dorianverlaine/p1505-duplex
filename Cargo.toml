[package]
name = "p1505-duplex"
version = "0.1.0"
edition = "2024"
description = "Manual duplex (and firmware auto-load) for the HP LaserJet P1505 on a CUPS server"
license = "MIT"
repository = "https://github.com/dorianverlaine/p1505-duplex-rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
lopdf = "0.45.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"

[profile.release]
strip = true
lto = true
