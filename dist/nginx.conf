# Example nginx site: CUPS web interface + the duplex continue page.
# Set server_name to the print server's LAN names.
#
# CUPS answers 400 Bad Request to Host headers it does not recognise, so
# forward the loopback Host it accepts.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name print-server.lan print-server.local;

    location = /duplex {
        return 301 /duplex/;
    }
    location /duplex/ {
        proxy_pass http://127.0.0.1:8631/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:631;
        proxy_set_header Host 127.0.0.1:631;
        proxy_http_version 1.1;
        client_max_body_size 100m;
    }
}
