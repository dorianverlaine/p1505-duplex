# /etc/p1505-duplex.conf

# CUPS queue of the real, single-sided printer.
PRINTER=HP_LaserJet_P1505

# How the back sides are sent. Depends on the paper path and on how the
# printed stack goes back into the tray; check with a test print
# (p1505-duplex test-pdf) and adjust.
#   EVEN_ORDER   reverse | forward   order of the back sides
#   EVEN_ROTATE  0 | 180             extra rotation of every back side
EVEN_ORDER=reverse
EVEN_ROTATE=180

# Where the continue page listens (put nginx in front of it).
#LISTEN=127.0.0.1:8631

# Per-job records and source PDFs, kept 24 h for reprints.
#STATE_DIR=/var/spool/p1505-duplex
